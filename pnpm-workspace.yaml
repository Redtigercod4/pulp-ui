nodeVersion: "24.14.0"
saveExact: true
packages:
  - "packages/*"
minimumReleaseAge: 10080 # 7 Days
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600 # 90 days
blockExoticSubdeps: true
engineStrict: true
catalog:
  typescript: 7.0.2
  "@types/node": 26.2.0
minimumReleaseAgeExclude:
  - vite@8.2.2
allowBuilds:
  '@swc/core': true
